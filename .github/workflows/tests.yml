name: tests

# The suite is part of the repository, so it should be runnable by anyone who
# clones it and by this project on every push. GitHub-hosted Windows runners do
# not have the optional assets (bundled Wolf CLI, KiriKiri sidecars, local game
# samples); the tests that need them skip themselves and report why.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run the test suite
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests -q -rs
